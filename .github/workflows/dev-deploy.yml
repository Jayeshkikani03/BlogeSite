name: Development Deployment

on:
  push:
    branches:
      - develop

jobs:
  deploy-dev:
    name: Build and Prepare Dev Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image
        run: |
          docker build -t techflow-frontend:dev-${{ github.sha }} -t techflow-frontend:develop ./frontend

      - name: Build Backend Docker Image
        run: |
          docker build -t techflow-backend:dev-${{ github.sha }} -t techflow-backend:develop ./backend

      - name: Generate Build Metadata
        run: |
          echo "{\"environment\": \"development\", \"commit\": \"${{ github.sha }}\", \"branch\": \"${{ github.ref_name }}\", \"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" > build-info.json

      - name: Upload Build Info Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.json

      - name: Deploy to Dev AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/apps/techflow-dev/BlogeSite
            git pull origin develop
            DOCKER_BUILDKIT=0 docker compose up --build -d
