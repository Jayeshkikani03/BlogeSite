name: Development Deployment

on:
  push:
    branches:
      - develop

jobs:
  deploy-dev:
    name: Build and Prepare Dev Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image
        run: |
          docker build -t techflow-frontend:dev-${{ github.sha }} -t techflow-frontend:develop ./frontend

      - name: Build Backend Docker Image
        run: |
          docker build -t techflow-backend:dev-${{ github.sha }} -t techflow-backend:develop ./backend

      - name: Prepare Deployment (Mock AWS Step)
        run: |
          echo "AWS is not implemented yet."
          echo "Images built and successfully tagged with: dev-${{ github.sha }} and develop"
          echo "In the future, we will push these to ECR and trigger an ECS service update for the staging environment."
