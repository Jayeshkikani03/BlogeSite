version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techflow-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
      - ALLOWED_ORIGINS=http://dev.quizgameh5.com,https://dev.quizgameh5.com,http://3.6.197.13:3000,http://localhost:3000
    healthcheck:
      # Docker healthcheck to ensure the backend is actually ready to serve traffic
      test: [ "CMD", "wget", "-qO-", "http://localhost:5000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - techflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://dev.quizgameh5.com/api
    container_name: techflow-frontend
    ports:
      - "3000:80"
    depends_on:
      # Ensure backend starts before frontend, though it doesn't guarantee backend is fully 'ready' without conditions
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - techflow-network

# Define a custom network so containers can communicate using their service names (e.g., 'backend' or 'frontend')
networks:
  techflow-network:
    driver: bridge
