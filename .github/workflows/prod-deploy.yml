name: Production Deployment & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  release-and-deploy:
    name: Build, Version, and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Tag Version Format
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag $TAG_NAME does not follow SemVer format (vX.Y.Z)"
            exit 1
          fi
          echo "Version tag $TAG_NAME is valid."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Tag Frontend Image
        run: |
          docker build \
            -t techflow-frontend:latest \
            -t techflow-frontend:${{ github.sha }} \
            -t techflow-frontend:${{ github.ref_name }} \
            ./frontend

      - name: Build and Tag Backend Image
        run: |
          docker build \
            -t techflow-backend:latest \
            -t techflow-backend:${{ github.sha }} \
            -t techflow-backend:${{ github.ref_name }} \
            ./backend

      - name: Generate Release Metadata
        run: |
          echo "{\"environment\": \"production\", \"commit\": \"${{ github.sha }}\", \"branch\": \"${{ github.ref_name }}\", \"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" > build-info.json

      - name: Upload Build Info Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/apps/techflow/BlogeSite
            git pull origin main
            DOCKER_BUILDKIT=0 docker compose up --build -d
