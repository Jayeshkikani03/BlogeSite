name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
      - 'bugfix/*'
      - 'hotfix/*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build, Lint, and Dockerize
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Linter (Frontend)
        working-directory: ./frontend
        run: npm run lint

      - name: Run Linter (Backend)
        working-directory: ./backend
        run: npm run lint --if-present

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build

      - name: Build Backend Application (Mock)
        working-directory: ./backend
        run: echo "Backend build successful (No compile required for Node)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config -q

      - name: Build Docker Images (Compose)
        run: docker compose build
