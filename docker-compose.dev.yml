version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techflow-backend-dev
    # Override the command to use a development runner (e.g., nodemon or npm run dev)
    command: npm run dev
    # Mount the local backend directory to /app in the container for hot reloading
    volumes:
      - ./backend:/app
      - /app/node_modules # Prevent local node_modules from overwriting container node_modules
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - FRONTEND_URL=http://localhost:5173
    networks:
      - techflow-network-dev

  frontend:
    # Use a raw node image for development to run Vite directly with hot module replacement
    image: node:20-alpine
    container_name: techflow-frontend-dev
    working_dir: /app
    # Command to start Vite, exposing it to the container's network interface
    command: sh -c "npm install && npm run dev -- --host"
    # Mount the local frontend directory
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      # In development, the browser talks directly to the backend via localhost
      - VITE_API_URL=http://localhost:5000
    networks:
      - techflow-network-dev

networks:
  techflow-network-dev:
    driver: bridge
